{% extends 'layout.html' %}
<!DOCTYPE html>
<html>
    {% block homecontent %}
    <head>
        <title>Blood Request</title>
        <style>
            h3
            {
                text-align: center;
                padding: 50px;
                font-weight: bolder;
            }
            body
            {
                background-color: #f6f6f6;
            }
            button
            {
                padding: 5px 50px;
                margin-top: 20px;
                border: none;
                background: linear-gradient(to right, #c7080c, #f1bfbf);
            }
            .grid
            {
                display: grid;
                gap: 20px;
                grid-template-columns: repeat(2,1fr);
            }
        </style>
    </head>
    <body> 
        <div class="container">
            <h3>Blood Request</h3>
            <form method="post">
                {% csrf_token %}
                <div class="grid">
                    {{ form.name }}
                    {{ form.age }}
                    {{ form.gender }}
                    {{ form.blood }}
                    {{ form.units }}
                    {{ form.urgent }}
                    {{ form.date }}
                    {{ form.hos }}
                    {{ form.add }}
                    {{ form.requester }}
                </div>
                <center><button type="submit">Submit</button></center>
            </form>
        </div>
    <!-- </body> -->
    {% endblock %}
<!-- </html> -->
