<!DOCTYPE html>
<html>
    <head>
        {% load static %}
        <title>Login</title>
        <style>
            .text
            {
                position: absolute;
                z-index: 1;
                color: white;
                padding:280px 365px;
            }
            .text button
            {
                background-color: transparent;
                border: none;
                color: white;
                font-weight: bold;
                font-size: medium;
                padding: 12px;
                border-radius: 30px 0 0 30px;
            }
            .text button:hover
            {
                background-color: white;
            }
            button a:hover
            {
                color: black;
            }
            .input-container input
            {
                width: 320px;
                padding: 10px;
                border: none;
                border-bottom: 1px solid black;
                background-color: transparent;
            }
            form button
            {
                padding: 10px 40px;
                background: linear-gradient(to right,#c7080c,#f1bfbf);
                border: none;
                margin-left: 100px;
            }
            button a
            {
                text-decoration: none;
                color: white;
            }
            .input-container 
            {
                position: relative;
            }

            .floating-label 
            {
                position: absolute;
                top: -10px;
                left: 5px;
                font-size: 12px;
                color: #555;
            }

        </style>
    </head>
    <body style="display: flex;">
        <div>
            <div class="text">
                <button><a href="admin">Log in</a></button><br><br><br>
                <button><a href="signin">Signin</a></button>
            </div>
            <img src="{% static 'images/bg.jpg' %}"  style="position: relative;" height="655px">
        </div>
        {% block content%}
        <div style="display: flex; justify-content: center;align-items: center; padding-left: 250px;z-index: 999;">
            <div>
                <h1 style="text-align: center;color: #c7080c;">LOGIN</h1><br><br><br>
                <form method="post" action="{% url 'admin' %}">
                {% csrf_token %}
                <div class="input-container">
                    <label class="floating-label">Username</label><br>
                    {{ form.username }} 
                </div><br><br>
                <div class="input-container">
                    <label class="floating-label">Password</label><br>
                    {{ form.password }}
                </div><br>
                <div>
                    {{ form.remember_me }}&nbsp;Remember Me
                    <a href="reset" style="padding-left: 25%;color: #c7080c;">Forgot Password?</a><br><br>
                </div>
                <button type="submit">LOGIN</button>
            </form>
            {% if form.errors %}
            <div class="error">
                <p>Your username and password didn't match. Please try again.</p>
            </div>
            {% endif %}
            </div>
        </div>
        {% endblock %}
    </body>
</html>
